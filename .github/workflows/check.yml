name: Discord TestFlight Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Discord TestFlight
        run: |
          PAGE=$(curl -L -s https://testflight.apple.com/join/gdE4pRzI)

          if echo "$PAGE" | grep -qi "beta is full"; then
            echo "Discord beta is still full."
          else
            echo "🚨 DISCORD TESTFLIGHT MAY BE OPEN!"

            curl -s -X POST \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
            -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -d text="🚨 Discord TestFlight may be OPEN! Join now: https://testflight.apple.com/join/gdE4pRzI"

            exit 1
          fi

